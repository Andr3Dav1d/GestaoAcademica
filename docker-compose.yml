services:
  app:
    build: .
    container_name: gestao-academica-app
    restart: always
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gestao-academica-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gestao_academica
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gestao_academica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
