services:
  app:
    image: ghcr.io/andr3dav1d/gestaoacademica:latest
    container_name: gestao-academica-app
    restart: always
    user: "0:0"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://gestao_user:gestao_pass@postgres:5432/gestao_academica
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gestao-academica-postgres
    restart: always
    environment:
      POSTGRES_USER: gestao_user
      POSTGRES_PASSWORD: gestao_pass
      POSTGRES_DB: gestao_academica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao_user -d gestao_academica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
